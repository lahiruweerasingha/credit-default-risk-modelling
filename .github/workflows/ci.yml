name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      SPARK_MASTER: local[2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
      - name: Install
        run: uv sync --python 3.11 --frozen --extra spark --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest (incl. Spark leakage tests on synthetic data)
        run: uv run pytest -q

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-data-files
        name: block raw / loan-level data files
        entry: data files must not be committed (Freddie Mac terms)
        language: fail
        files: \.(txt|parquet|zip|csv)$
        exclude: ^(reports/.*\.csv|requirements.*\.txt)$

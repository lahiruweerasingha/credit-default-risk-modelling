[project]
name = "creditrisk"
version = "0.1.0"
description = "Behavioural mortgage PD modelling: WoE scorecard vs XGBoost, with explainability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    # CPU-only wheel on Linux avoids ~200 MB of CUDA/NCCL libraries in the images
    "xgboost-cpu==2.1.3; sys_platform == 'linux'",
    "xgboost==2.1.3; sys_platform != 'linux'",
    "mlflow-skinny==2.17.2",
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.3"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.27.2",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[project.scripts]
creditrisk = "creditrisk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditrisk"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["spark: needs a Java runtime and PySpark"]
filterwarnings = ["ignore::DeprecationWarning"]
